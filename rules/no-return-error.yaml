id: no-return-error
language: lean
message: Avoid using `return .error e` in Except monad contexts.
severity: warning
note: Use `throw e` instead of `return .error e` for clearer error handling
rule:
  kind: do_return
  has:
    field: value
    kind: apply
    all:
      - has:
          field: name
          kind: identifier
          regex: '^\.error$'
      - has:
          field: arguments
          any:
            - kind: identifier
            - kind: string
            - kind: proj
            - kind: apply
